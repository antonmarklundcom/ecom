name: Distribuir a las tiendas

# plan-operacion.md §6.5: el template le empuja un PR a cada tienda creada
# con "Use this template" (tiendas.json) con la maquinaria nueva de cada
# versión. Cada tienda decide si lo mergea — su propio CI es el que manda.
#
# Corre al publicar una versión del template (tag `v*`, ver CHANGELOG.md) o a
# mano, no en cada push a main: cada corrida abre un PR en cada tienda, y cada
# uno de esos PRs corre el CI de esa tienda. Agrupar los arreglos en versiones
# es lo que mantiene los minutos de Actions bajo control con muchas tiendas.
#
# Anillos (O28, NEW-STORE.md § "La distribución automática del template"):
# el tag llega SÓLO a las tiendas `"anillo": 0` (canarias). El resto
# (`"anillo": 1`) recibe esa versión con un "Run workflow" a mano que nombra el
# tag. Una tienda `"estado": "pausada"` no recibe nada. Quién recibe qué lo
# decide `scripts/ci/elegir-tiendas.mjs`, el mismo que usa
# `pnpm template:ensayar-distribucion`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a distribuir: un tag v* que ya existe (p. ej. v2.0.0)"
        required: true
        type: string
      anillo:
        description: "1 = el resto de las tiendas (después de las canarias); 0 = repetir las canarias"
        required: true
        type: choice
        options: ["1", "0"]
        default: "1"

# Dos corridas a la vez empujarían a la misma rama de la misma tienda: la
# segunda espera. Nunca se cancela una a medias (escribe en otros repos).
concurrency:
  group: distribuir
  cancel-in-progress: false

jobs:
  # Lee tiendas.json una sola vez y decide si hay algo para hacer, para que
  # la matrix de abajo ni se arme cuando no hace falta (una tienda vacía o
  # sin TIENDAS_TOKEN no debe aparecer como "0 jobs corridos", tiene que
  # decir por qué en el log — es justamente lo que se prueba en este repo).
  preparar:
    # Este archivo viaja a cada tienda (Use this template, bootstrap:repo,
    # template:sync), pero sólo tiene sentido en el template: en una tienda no
    # debe levantar ni un runner.
    if: github.repository == 'antonmarklundcom/ecom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lotes: ${{ steps.elegir.outputs.lotes }}
      version: ${{ steps.elegir.outputs.version }}
      hay_token: ${{ steps.token.outputs.hay }}
    steps:
      # tiendas.json siempre de la rama principal, no del tag: pausar una
      # tienda (o pasarla de anillo) tiene que valer para la próxima corrida,
      # aunque la versión se haya etiquetado antes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Elegir las tiendas de esta corrida
        id: elegir
        env:
          EVENTO: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANILLO: ${{ inputs.anillo }}
        run: node scripts/ci/elegir-tiendas.mjs

      - name: El tag existe
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.elegir.outputs.version }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::No existe el tag ${VERSION} en este repo: el anillo 1 se distribuye nombrando una versión ya publicada (la que recibieron las canarias)."
            exit 1
          fi

      - name: Hay TIENDAS_TOKEN
        id: token
        env:
          TIENDAS_TOKEN: ${{ secrets.TIENDAS_TOKEN }}
        run: |
          if [ -n "${TIENDAS_TOKEN:-}" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
          fi

      # En rojo, no en amarillo: con un aviso la corrida quedaba verde y la
      # distribución no llegó a correr ni una vez en trece corridas (hasta
      # 2026-09-24) sin que nadie se diera cuenta. Hay tiendas elegidas y
      # ninguna recibe nada: eso es una falla.
      - name: Sin TIENDAS_TOKEN, falla
        if: steps.elegir.outputs.lotes != '[]' && steps.token.outputs.hay != 'true'
        run: |
          echo "::error::Hay tiendas para esta corrida pero no hay secrets.TIENDAS_TOKEN configurado en este repo, así que no se distribuye nada. Cargalo (NEW-STORE.md § La distribución automática del template; qué token: docs/decisions-needed.md)."
          exit 1

  # Un job por lote de tiendas (scripts/ci/elegir-tiendas.mjs: hasta 8 por
  # job, nunca más de 256 jobs, el tope de una matrix de GitHub). Dentro del
  # lote, una tienda que falla no frena a las otras; el job sale en rojo y el
  # resumen de la corrida dice cuál y por qué.
  distribuir:
    needs: preparar
    if: needs.preparar.outputs.lotes != '[]' && needs.preparar.outputs.hay_token == 'true'
    name: lote ${{ matrix.lote.numero }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        lote: ${{ fromJson(needs.preparar.outputs.lotes) }}

    steps:
      # Sin `path:` — este workflow ya vive en el template, así que
      # $GITHUB_WORKSPACE ES el template (igual que en ci.yml), en el tag que
      # se distribuye. Eso mantiene a `pnpm/action-setup` leyendo
      # `packageManager` de `package.json` en la raíz sin nada especial, y deja
      # un solo checkout para usar como remoto `template` de cada tienda
      # (clonada aparte, en `./tiendas/`).
      - name: Checkout del template
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.preparar.outputs.version }}
          # Historia completa y tags: la tienda se compara contra su
          # `.template-baseline`, que puede ser un commit arbitrariamente viejo,
          # y la edad de un PR de sync se cuenta en versiones (tags).
          fetch-depth: 0

      - name: Asegurar una rama local "main" para servir de remoto
        # `actions/checkout` deja el HEAD **detached** en el tag — no existe
        # `refs/heads/main` local. `template:sync` (acá y en cada tienda) hace
        # `git fetch template main`: sin una rama local con ese nombre, git no
        # tiene qué mandarle. `-B` la crea o la mueve al HEAD actual.
        run: git checkout -B main

      # `pnpm`/`node` y las dependencias del template: `template-sync.ts` corre
      # desde acá (la versión de este tag), con la tienda como directorio de
      # trabajo, y nunca corre `pnpm install` del lado de la tienda.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias del template
        run: pnpm install --frozen-lockfile

      - name: Sincronizar y abrir (o actualizar) los PRs del lote
        env:
          REPOS: ${{ toJson(matrix.lote.repos) }}
          VERSION: ${{ needs.preparar.outputs.version }}
          TIENDAS_TOKEN: ${{ secrets.TIENDAS_TOKEN }}
        run: node scripts/ci/distribuir-lote.mjs
