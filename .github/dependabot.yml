version: 2
updates:
  # Repos creados con "Use this template" no reciben commits posteriores del
  # template (ver NEW-STORE.md), así que un parche de seguridad acá no llega
  # solo a las tiendas ya creadas. Esto al menos mantiene al día el template,
  # que es de donde salen las tiendas nuevas y de donde se cherry-pickean los
  # arreglos con `pnpm template:diff`.
  #
  # Mensual y no semanal: cada PR de Dependabot corre el CI (minutos de
  # Actions en repo privado). Una tienda no tiene este archivo —`pnpm
  # nueva-tienda` lo borra, ver SOLO_TEMPLATE en scripts/template-shared.ts—:
  # sus dependencias llegan con template:sync.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
