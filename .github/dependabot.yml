version: 2
updates:
  # Sólo el template: una tienda no tiene este archivo —`pnpm nueva-tienda` lo
  # borra y `template:sync` se lo saca a las viejas, ver SOLO_TEMPLATE en
  # scripts/template-shared.ts—. Las dependencias le llegan a cada tienda con
  # el PR `template/sync` de cada versión, ya probadas acá.
  #
  # Mensual y no semanal: cada PR de Dependabot corre el CI completo, y
  # agruparlos deja menos PRs que revisar.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # `@types/node` sigue la versión mayor del runtime (Node 22: `.nvmrc`,
    # `engines`, CI y Hostinger). Con los tipos de una mayor más nueva, el
    # typecheck acepta APIs que en producción no existen (#112).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
